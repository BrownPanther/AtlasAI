<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 40" fill="none">
  <defs>
    <linearGradient id="atlasGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <g transform="translate(6, 4)">
    <circle cx="16" cy="16" r="14" stroke="url(#atlasGrad)" stroke-width="1.8" fill="none" opacity="0.4"/>
    <ellipse cx="16" cy="16" rx="14" ry="6" stroke="url(#atlasGrad)" stroke-width="1.6" fill="none" transform="rotate(-25 16 16)" />
    <ellipse cx="16" cy="16" rx="6" ry="14" stroke="url(#atlasGrad)" stroke-width="1.6" fill="none" transform="rotate(-25 16 16)" opacity="0.6"/>
    <circle cx="16" cy="16" r="4.5" fill="url(#atlasGrad)" filter="url(#glow)"/>
    <circle cx="25" cy="8" r="1.5" fill="#F472B6" filter="url(#glow)"/>
  </g>
  <text x="44" y="22" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="19" font-weight="700" letter-spacing="-0.02em" fill="#FFFFFF">Atlas<tspan fill="#A78BFA">AI</tspan></text>
  <text x="44" y="32" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="7.5" font-weight="600" letter-spacing="0.22em" fill="#C084FC" opacity="0.9">AI TRAVEL STUDIO</text>
</svg>
